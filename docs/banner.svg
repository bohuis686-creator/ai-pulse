<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">AI Pulse</title><desc id="desc">Reproducible prompts. Transparent scores. A local AI performance check.</desc><rect width="1200" height="370" rx="20" fill="#1d3027"/><g fill="none" stroke="#38513b" stroke-width="1"><path d="M720 0v370M800 0v370M880 0v370M960 0v370M1040 0v370M1120 0v370M680 65h520M680 145h520M680 225h520M680 305h520"/></g><text x="64" y="72" fill="#bdccab" font-family="Arial,sans-serif" font-size="13" letter-spacing="4">A SMALL CHECK. A CLEARER PICTURE.</text><text x="60" y="180" fill="#d4f69b" font-family="Arial,sans-serif" font-size="84" font-weight="700" letter-spacing="-4">AI Pulse.</text><text x="65" y="235" fill="#f6f6ef" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24">把感觉变成可对照的记录。</text><text x="65" y="311" fill="#b0c0a8" font-family="Arial,sans-serif" font-size="15">24 tasks / 6 dimensions / 0 runtime dependencies</text><path d="M690 185h83l36-58 53 119 51-160 47 99h130" fill="none" stroke="#d4f69b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1090" cy="185" r="8" fill="#d4f69b"/><text x="820" y="321" fill="#8fa181" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">OPEN SOURCE · LOCAL FIRST</text></svg>
